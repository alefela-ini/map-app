server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker's embedded DNS. With a literal host in proxy_pass, nginx resolves "api" only once at startup and
  # keeps that IP: after the api container is recreated (new IP) every /api request would fail with 502.
  # Using a variable makes nginx resolve the name at request time (cached for `valid`).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Same-origin API: forward /api to the ASP.NET Core container.
  location /api/ {
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;  # no URI part: the original request URI (/api/...) is passed unchanged
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
