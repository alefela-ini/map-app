<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 790" width="1500" height="790" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    text { fill: #1f2937; }
    .t { font-size: 22px; font-weight: 700; }
    .st { font-size: 13px; fill: #6b7280; }
    .zone { font-size: 13px; font-weight: 800; letter-spacing: .5px; }
    .h { font-size: 13.5px; font-weight: 700; }
    .b { font-size: 12px; }
    .s { font-size: 11px; fill: #6b7280; }
    .m { font-family: Consolas, Menlo, monospace; font-size: 11px; }
    .la { fill: #7c3aed; font-weight: 700; }
    .lo { fill: #c2410c; font-weight: 700; }
    .fix { fill: #b91c1c; }
    .c { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.2; }
    .w { fill: #f9fafb; stroke: #6b7280; stroke-width: 1.2; }
    .sv { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.2; }
    .db { fill: #fffbeb; stroke: #d97706; stroke-width: 1.2; }
    .a { stroke: #374151; stroke-width: 1.8; fill: none; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="1500" height="790" fill="#ffffff"/>
  <text x="20" y="36" class="t">4. Coordinate flow: one polygon from click to database and back</text>
  <text x="20" y="58" class="st">Example: triangle A-B-C near Tel Aviv, drawn clockwise. <tspan class="la">latitude</tspan> and <tspan class="lo">longitude</tspan> are colour-coded so the axis order is visible at every step.</text>
  <rect x="20" y="78" width="570" height="690" rx="12" fill="#eff6ff" opacity=".55"/>
  <text x="32" y="100" class="zone" fill="#1d4ed8">CLIENT — { lat, lng } objects</text>
  <rect x="600" y="78" width="280" height="690" rx="12" fill="#f3f4f6" opacity=".55"/>
  <text x="612" y="100" class="zone" fill="#4b5563">WIRE — GeoJSON [lng, lat]</text>
  <rect x="890" y="78" width="590" height="690" rx="12" fill="#ecfdf5" opacity=".55"/>
  <text x="902" y="100" class="zone" fill="#047857">SERVER + MongoDB — GeoJSON [lng, lat]</text>
  <text x="20" y="124" class="s">Axis order is converted in exactly two places: client geo.ts (toPosition / fromPosition) and server GeoJsonMapper. Everything between them speaks GeoJSON.</text>
  <text x="20" y="140" class="s" font-weight="700">WRITE PATH →</text>
  <text x="20" y="462" class="s" font-weight="700">← READ PATH (after Save, and on every page load)</text>
  <rect x="30" y="150" width="270" height="240" rx="9" class="c"/>
  <text x="42" y="172" class="h">① Click on the map</text>
  <text x="42" y="192" class="b" xml:space="preserve">DrawingLayer: click → e.latlng</text>
  <text x="42" y="207.5" class="m" xml:space="preserve">{ lat: <tspan class="la">32.08</tspan>, lng: <tspan class="lo">34.78</tspan> }</text>
  <text x="42" y="229.0" class="b" xml:space="preserve">normalizeLatLng():</text>
  <text x="42" y="244.5" class="m" xml:space="preserve">lat: clamp to [-90, 90]</text>
  <text x="42" y="260.0" class="m" xml:space="preserve">lng: wrap only if outside ±180</text>
  <text x="42" y="275.5" class="s" xml:space="preserve">world copy: lng 394.78 → 34.78</text>
  <text x="42" y="291.0" class="s" xml:space="preserve"><tspan class="fix">bug fixed: wrapping valid values added</tspan></text>
  <text x="42" y="306.5" class="s" xml:space="preserve"><tspan class="fix">float noise (34.78000000000003)</tspan></text>
  <text x="42" y="328.0" class="b" xml:space="preserve">clicks A, B, C, then A again</text>
  <text x="42" y="343.5" class="s" xml:space="preserve">≤ 12 px from A closes (needs ≥ 3)</text>
  <text x="42" y="359.0" class="s" xml:space="preserve">polygonProblem() checks it first</text>
  <rect x="320" y="150" width="270" height="240" rx="9" class="c"/>
  <text x="332" y="172" class="h">② Draft view model (MapPolygon)</text>
  <text x="332" y="192" class="m" xml:space="preserve">{ id: &#x27;draft-9f3c…&#x27;,</text>
  <text x="332" y="207.5" class="m" xml:space="preserve">  name: &#x27;Polygon 1&#x27;,</text>
  <text x="332" y="223.0" class="m" xml:space="preserve">  saved: false,</text>
  <text x="332" y="238.5" class="m" xml:space="preserve">  vertices: [</text>
  <text x="332" y="254.0" class="m" xml:space="preserve">    A { lat: <tspan class="la">32.08</tspan>, lng: <tspan class="lo">34.78</tspan> },</text>
  <text x="332" y="269.5" class="m" xml:space="preserve">    B { lat: <tspan class="la">32.10</tspan>, lng: <tspan class="lo">34.82</tspan> },</text>
  <text x="332" y="285.0" class="m" xml:space="preserve">    C { lat: <tspan class="la">32.06</tspan>, lng: <tspan class="lo">34.83</tspan> } ] }</text>
  <text x="332" y="306.5" class="b" xml:space="preserve">OPEN ring: A is not repeated</text>
  <text x="332" y="322.0" class="s" xml:space="preserve">lives only in the browser (drafts)</text>
  <text x="332" y="337.5" class="s" xml:space="preserve">drawn dashed orange, not in the table</text>
  <text x="332" y="353.0" class="s" xml:space="preserve">draft id: 128 random bits = clientId</text>
  <rect x="610" y="150" width="270" height="240" rx="9" class="w"/>
  <text x="622" y="172" class="h">③ POST /api/polygons</text>
  <text x="622" y="192" class="s" xml:space="preserve">polygonToRequest + toPosition</text>
  <text x="622" y="207.5" class="m" xml:space="preserve">[{ &quot;name&quot;: &quot;Polygon 1&quot;,</text>
  <text x="622" y="223.0" class="m" xml:space="preserve">   &quot;geometry&quot;: {</text>
  <text x="622" y="238.5" class="m" xml:space="preserve">     &quot;type&quot;: &quot;Polygon&quot;,</text>
  <text x="622" y="254.0" class="m" xml:space="preserve">     &quot;coordinates&quot;: [[</text>
  <text x="622" y="269.5" class="m" xml:space="preserve">       [<tspan class="lo">34.78</tspan>, <tspan class="la">32.08</tspan>],   A</text>
  <text x="622" y="285.0" class="m" xml:space="preserve">       [<tspan class="lo">34.82</tspan>, <tspan class="la">32.10</tspan>],   B</text>
  <text x="622" y="300.5" class="m" xml:space="preserve">       [<tspan class="lo">34.83</tspan>, <tspan class="la">32.06</tspan>],   C</text>
  <text x="622" y="316.0" class="m" xml:space="preserve">       [<tspan class="lo">34.78</tspan>, <tspan class="la">32.08</tspan>]    A</text>
  <text x="622" y="331.5" class="m" xml:space="preserve">     ]] } }]</text>
  <text x="622" y="353.0" class="b" xml:space="preserve">CLOSED ring, [lng, lat] (RFC 7946)</text>
  <text x="622" y="368.5" class="s" xml:space="preserve">array → several drafts in one request</text>
  <rect x="900" y="150" width="270" height="240" rx="9" class="sv"/>
  <text x="912" y="172" class="h">④ GeometryValidator</text>
  <text x="912" y="192" class="m" xml:space="preserve">Position(Longitude, Latitude)</text>
  <text x="912" y="207.5" class="s" xml:space="preserve">ranges · dedupe · drop closing A</text>
  <text x="912" y="223.0" class="m" xml:space="preserve">ring = A, B, C</text>
  <text x="912" y="238.5" class="s" xml:space="preserve">self-intersection? no · area ≠ 0? yes</text>
  <text x="912" y="260.0" class="m" xml:space="preserve">SignedArea(ring) &lt; 0  → clockwise</text>
  <text x="912" y="275.5" class="s" xml:space="preserve">RFC 7946: exterior ring must be CCW</text>
  <text x="912" y="291.0" class="m" xml:space="preserve">ring.Reverse(1, n-1)</text>
  <text x="912" y="306.5" class="m" xml:space="preserve">ring = A, C, B      (A stays first)</text>
  <text x="912" y="322.0" class="s" xml:space="preserve"><tspan class="fix">bug fixed: full Reverse moved the</tspan></text>
  <text x="912" y="337.5" class="s" xml:space="preserve"><tspan class="fix">user&#x27;s first vertex</tspan></text>
  <text x="912" y="359.0" class="m" xml:space="preserve">ring.Add(ring[0]) → A, C, B, A</text>
  <rect x="1190" y="150" width="270" height="240" rx="9" class="db"/>
  <text x="1202" y="172" class="h">⑤ Stored in MongoDB</text>
  <text x="1202" y="192" class="s" xml:space="preserve">GeoJsonMapper.ToMongoPolygon</text>
  <text x="1202" y="207.5" class="m" xml:space="preserve">{ _id: ObjectId(&#x27;6729…&#x27;),</text>
  <text x="1202" y="223.0" class="m" xml:space="preserve">  name: &#x27;Polygon 1&#x27;,</text>
  <text x="1202" y="238.5" class="m" xml:space="preserve">  geometry: {</text>
  <text x="1202" y="254.0" class="m" xml:space="preserve">    type: &#x27;Polygon&#x27;,</text>
  <text x="1202" y="269.5" class="m" xml:space="preserve">    coordinates: [[</text>
  <text x="1202" y="285.0" class="m" xml:space="preserve">      [<tspan class="lo">34.78</tspan>, <tspan class="la">32.08</tspan>], [<tspan class="lo">34.83</tspan>, <tspan class="la">32.06</tspan>],</text>
  <text x="1202" y="300.5" class="m" xml:space="preserve">      [<tspan class="lo">34.82</tspan>, <tspan class="la">32.10</tspan>], [<tspan class="lo">34.78</tspan>, <tspan class="la">32.08</tspan>]</text>
  <text x="1202" y="316.0" class="m" xml:space="preserve">    ]] },</text>
  <text x="1202" y="331.5" class="m" xml:space="preserve">  createdAt: ISODate(…) }</text>
  <text x="1202" y="353.0" class="b" xml:space="preserve">2dsphere index on geometry</text>
  <text x="1202" y="368.5" class="s" xml:space="preserve">invalid GeoJSON → error 16755 → 400</text>
  <rect x="1190" y="472" width="270" height="295" rx="9" class="db"/>
  <text x="1202" y="494" class="h">⑥ GetAllAsync()</text>
  <text x="1202" y="514" class="m" xml:space="preserve">find({}).sort({ _id: 1 })</text>
  <text x="1202" y="529.5" class="s" xml:space="preserve">ObjectId begins with a timestamp,</text>
  <text x="1202" y="545.0" class="s" xml:space="preserve">so _id order = creation order</text>
  <text x="1202" y="566.5" class="b" xml:space="preserve">driver deserializes BSON into</text>
  <text x="1202" y="582.0" class="m" xml:space="preserve">PolygonDocument {</text>
  <text x="1202" y="597.5" class="m" xml:space="preserve">  Geometry: GeoJsonPolygon&lt;</text>
  <text x="1202" y="613.0" class="m" xml:space="preserve">    GeoJson2DGeographicCoordinates&gt;</text>
  <text x="1202" y="628.5" class="m" xml:space="preserve">}</text>
  <text x="1202" y="650.0" class="s" xml:space="preserve">MongoConventions: camelCase fields,</text>
  <text x="1202" y="665.5" class="s" xml:space="preserve">enums as strings, ignore extra fields</text>
  <rect x="900" y="472" width="270" height="295" rx="9" class="sv"/>
  <text x="912" y="494" class="h">⑦ GeoJsonMapper.ToDto</text>
  <text x="912" y="514" class="m" xml:space="preserve">Exterior.Positions.Select(p =&gt;</text>
  <text x="912" y="529.5" class="m" xml:space="preserve">  [p.Longitude, p.Latitude])</text>
  <text x="912" y="551.0" class="m" xml:space="preserve">PolygonDto(Id, Name,</text>
  <text x="912" y="566.5" class="m" xml:space="preserve">  PolygonGeometry, CreatedAt)</text>
  <text x="912" y="588.0" class="s" xml:space="preserve">ring stays CLOSED and CCW: A, C, B, A</text>
  <text x="912" y="603.5" class="s" xml:space="preserve">System.Text.Json → camelCase</text>
  <text x="912" y="619.0" class="s" xml:space="preserve">enum symbol → &quot;marker&quot; / &quot;jeep&quot;</text>
  <text x="912" y="634.5" class="s" xml:space="preserve">(integers rejected on input)</text>
  <rect x="610" y="472" width="270" height="295" rx="9" class="w"/>
  <text x="622" y="494" class="h">⑧ 200 OK — the full list</text>
  <text x="622" y="514" class="m" xml:space="preserve">[{ &quot;id&quot;: &quot;6729…&quot;,</text>
  <text x="622" y="529.5" class="m" xml:space="preserve">   &quot;name&quot;: &quot;Polygon 1&quot;,</text>
  <text x="622" y="545.0" class="m" xml:space="preserve">   &quot;geometry&quot;: {</text>
  <text x="622" y="560.5" class="m" xml:space="preserve">     &quot;type&quot;: &quot;Polygon&quot;,</text>
  <text x="622" y="576.0" class="m" xml:space="preserve">     &quot;coordinates&quot;: [[</text>
  <text x="622" y="591.5" class="m" xml:space="preserve">       [<tspan class="lo">34.78</tspan>, <tspan class="la">32.08</tspan>], [<tspan class="lo">34.83</tspan>, <tspan class="la">32.06</tspan>],</text>
  <text x="622" y="607.0" class="m" xml:space="preserve">       [<tspan class="lo">34.82</tspan>, <tspan class="la">32.10</tspan>], [<tspan class="lo">34.78</tspan>, <tspan class="la">32.08</tspan>]</text>
  <text x="622" y="622.5" class="m" xml:space="preserve">     ]] },</text>
  <text x="622" y="638.0" class="m" xml:space="preserve">   &quot;createdAt&quot;: &quot;2026-11-04T…Z&quot;</text>
  <text x="622" y="653.5" class="m" xml:space="preserve"> }, … every saved polygon … ]</text>
  <text x="622" y="675.0" class="s" xml:space="preserve">same body for GET /api/polygons</text>
  <rect x="320" y="472" width="270" height="295" rx="9" class="c"/>
  <text x="332" y="494" class="h">⑨ polygonFromDto → MapPolygon</text>
  <text x="332" y="514" class="s" xml:space="preserve">fromPosition([lng, lat]) → { lat, lng }</text>
  <text x="332" y="529.5" class="s" xml:space="preserve">drop the closing vertex → OPEN ring</text>
  <text x="332" y="545.0" class="m" xml:space="preserve">{ id: &#x27;6729…&#x27;, saved: true,</text>
  <text x="332" y="560.5" class="m" xml:space="preserve">  vertices: [A, C, B] }</text>
  <text x="332" y="582.0" class="b" xml:space="preserve">Leaflet &lt;Polygon positions&gt; takes</text>
  <text x="332" y="597.5" class="m" xml:space="preserve">[[<tspan class="la">32.08</tspan>, <tspan class="lo">34.78</tspan>], [<tspan class="la">32.06</tspan>, <tspan class="lo">34.83</tspan>], …]</text>
  <text x="332" y="613.0" class="s" xml:space="preserve">Leaflet tuples are [lat, lng] —</text>
  <text x="332" y="628.5" class="s" xml:space="preserve">the opposite of GeoJSON!</text>
  <text x="332" y="650.0" class="s" xml:space="preserve">rendered solid blue, clickable</text>
  <text x="332" y="665.5" class="s" xml:space="preserve">vertex order is now A, C, B (CCW)</text>
  <rect x="30" y="472" width="270" height="295" rx="9" class="c"/>
  <text x="42" y="494" class="h">⑩ Map Data table (saved only)</text>
  <text x="42" y="514" class="s" xml:space="preserve">1 row per polygon (its center; ▸ expands</text>
  <text x="42" y="529.5" class="s" xml:space="preserve">the vertices) + 1 row per object; 6 dp</text>
  <rect x="42" y="556" width="246" height="22" fill="#dbeafe"/>
  <text x="48" y="571" class="b" font-weight="700">Object</text>
  <text x="174" y="571" class="b" font-weight="700">Lat</text>
  <text x="234" y="571" class="b" font-weight="700">Lon</text>
  <rect x="42" y="578" width="246" height="22" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="48" y="593" class="s" style="fill:#1f2937" xml:space="preserve">▾ Polygon 1 (3)</text>
  <text x="164" y="593" class="m la" style="font-weight:400">32.080000</text>
  <text x="226" y="593" class="m lo" style="font-weight:400">34.810000</text>
  <rect x="42" y="600" width="246" height="22" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="48" y="615" class="s" style="fill:#6b7280" xml:space="preserve">      vertex 1</text>
  <text x="164" y="615" class="m la" style="font-weight:400">32.080000</text>
  <text x="226" y="615" class="m lo" style="font-weight:400">34.780000</text>
  <rect x="42" y="622" width="246" height="22" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="48" y="637" class="s" style="fill:#6b7280" xml:space="preserve">      vertex 2</text>
  <text x="164" y="637" class="m la" style="font-weight:400">32.060000</text>
  <text x="226" y="637" class="m lo" style="font-weight:400">34.830000</text>
  <rect x="42" y="644" width="246" height="22" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="48" y="659" class="s" style="fill:#6b7280" xml:space="preserve">      vertex 3</text>
  <text x="164" y="659" class="m la" style="font-weight:400">32.100000</text>
  <text x="226" y="659" class="m lo" style="font-weight:400">34.820000</text>
  <rect x="42" y="666" width="246" height="22" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="48" y="681" class="s" style="fill:#1f2937" xml:space="preserve">   Jeep 1</text>
  <text x="164" y="681" class="m la" style="font-weight:400">31.771000</text>
  <text x="226" y="681" class="m lo" style="font-weight:400">35.217000</text>
  <text x="42" y="706" class="s">drafts are excluded; the panel header</text>
  <text x="42" y="721" class="s">shows "n unsaved" instead</text>
  <text x="42" y="740" class="s">row click → select + FocusController.flyTo</text>
  <path d="M302,270.0 L318,270.0" class="a"/>
  <path d="M318,619.5 L302,619.5" class="a"/>
  <path d="M592,270.0 L608,270.0" class="a"/>
  <path d="M608,619.5 L592,619.5" class="a"/>
  <path d="M882,270.0 L898,270.0" class="a"/>
  <path d="M898,619.5 L882,619.5" class="a"/>
  <path d="M1172,270.0 L1188,270.0" class="a"/>
  <path d="M1188,619.5 L1172,619.5" class="a"/>
  <path d="M1325.0,392 L1325.0,470" class="a"/>
  <text x="1333.0" y="435.0" class="s">Save returns GetAllAsync()</text>
</svg>
