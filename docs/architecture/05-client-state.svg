<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 800" width="1500" height="800" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    text { fill: #1f2937; }
    .t { font-size: 22px; font-weight: 700; }
    .st { font-size: 13px; fill: #6b7280; }
    .sec { font-size: 15px; font-weight: 800; }
    .h { font-size: 14px; font-weight: 700; }
    .b { font-size: 12px; }
    .s { font-size: 11px; fill: #6b7280; }
    .m { font-family: Consolas, Menlo, monospace; font-size: 11.5px; }
    .lbl { font-size: 11.5px; fill: #111827; }
    .lb { font-size: 11.5px; font-weight: 700; fill: #111827; }
    .red { fill: #b91c1c; }
    .st-idle { fill: #f3f4f6; stroke: #4b5563; stroke-width: 1.6; }
    .st-draw { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.6; }
    .st-place { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .st-draft { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.6; stroke-dasharray: 7 4; }
    .st-busy { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.6; }
    .st-saved { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; }
    .note { fill: #fafafa; stroke: #d1d5db; stroke-width: 1; }
    .a { stroke: #374151; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
    .ok { stroke: #059669; stroke-width: 1.8; fill: none; marker-end: url(#ahok); }
    .bad { stroke: #dc2626; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; marker-end: url(#ahr); }
    .grey { stroke: #9ca3af; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#ahg); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="ahok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
  </defs>

  <rect width="1500" height="800" fill="#ffffff"/>
  <text x="20" y="36" class="t">5. Client state: interaction mode and item lifecycle</text>
  <text x="20" y="58" class="st">Two independent state machines. (A) lives in App.tsx and decides what a map click means. (B) lives in useEditableCollection, one instance per resource.</text>

  <!-- ===================================== A ===================================== -->
  <rect x="20" y="78" width="720" height="700" rx="14" fill="#fcfcfd" stroke="#d1d5db"/>
  <text x="38" y="104" class="sec">A. InteractionMode — App.tsx</text>
  <text x="38" y="122" class="m">type InteractionMode = { kind: 'idle' } | { kind: 'drawPolygon' } | { kind: 'placeObject', symbol }</text>

  <!-- drawPolygon self-loop labels -->
  <text x="48" y="150" class="lb">while drawing (self-transitions):</text>
  <text x="48" y="166" class="lbl">• map click → addVertex(normalizeLatLng(latlng))</text>
  <text x="58" y="180" class="s">ignored if ≤ 3 px from the last vertex (double click)</text>
  <text x="48" y="196" class="lbl">• Backspace / Ctrl+Z → drop the last vertex</text>
  <text x="48" y="212" class="lbl">• click on A but polygonProblem ≠ null → <tspan class="red">drawingProblem</tspan></text>
  <path d="M110,262 C 80,226 250,226 220,262" class="a"/>

  <!-- drawPolygon -->
  <rect x="50" y="262" width="270" height="140" rx="16" class="st-draw"/>
  <text x="66" y="286" class="h">drawPolygon</text>
  <text x="66" y="306" class="b">DrawingLayer: polyline + rubber band</text>
  <text x="66" y="323" class="b">start vertex grows when closable (≥ 3)</text>
  <text x="66" y="340" class="b">doubleClickZoom disabled, crosshair</text>
  <text x="66" y="357" class="b">existing shapes non-interactive</text>
  <text x="76" y="372" class="s">(Leaflet can't toggle it → key = id:interactive)</text>
  <text x="66" y="391" class="m">drawingVertices: LatLng[]</text>

  <!-- placeObject -->
  <text x="450" y="166" class="lb">symbol selector (Marker | Jeep)</text>
  <text x="450" y="182" class="lbl">only sets the symbol for the next Add;</text>
  <text x="450" y="198" class="lbl">it is copied into the mode on Add.</text>
  <rect x="440" y="262" width="270" height="140" rx="16" class="st-place"/>
  <text x="456" y="286" class="h">placeObject(symbol)</text>
  <text x="456" y="306" class="b">PlacementLayer: next click places</text>
  <text x="456" y="323" class="b">crosshair cursor (map--placing)</text>
  <text x="456" y="340" class="b">existing shapes non-interactive</text>
  <text x="456" y="357" class="b">symbol is fixed for this placement</text>
  <text x="456" y="391" class="m">{ kind: 'placeObject', symbol: 'jeep' }</text>

  <!-- switch between modes -->
  <path d="M322,318 L438,318" class="a"/>
  <path d="M438,346 L322,346" class="a"/>
  <text x="380" y="308" text-anchor="middle" class="s">Objects Add</text>
  <text x="380" y="364" text-anchor="middle" class="s">Polygon Add</text>
  <text x="380" y="380" text-anchor="middle" class="s">(cancelMode first)</text>

  <!-- idle -->
  <rect x="240" y="600" width="280" height="130" rx="16" class="st-idle"/>
  <text x="256" y="624" class="h">idle  <tspan class="s" font-weight="400">(initial)</tspan></text>
  <text x="256" y="644" class="b">click polygon / marker → select</text>
  <text x="256" y="661" class="b">draft markers are draggable</text>
  <text x="256" y="678" class="b">Save / Delete buttons act on data</text>
  <text x="256" y="695" class="b">table row click → select + flyTo</text>
  <text x="256" y="717" class="m">{ kind: 'idle' }</text>
  <circle cx="200" cy="665" r="7" fill="#111827"/>
  <path d="M207,665 L238,665" class="a"/>

  <!-- idle -> drawPolygon -->
  <path d="M262,600 L92,404" class="a"/>
  <text x="40" y="482" class="lb">Polygon ▸ Add</text>
  <text x="40" y="497" class="s">startDrawing()</text>
  <!-- drawPolygon -> idle -->
  <path d="M200,404 L330,598" class="ok"/>
  <rect x="190" y="440" width="185" height="96" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="198" y="457" class="lbl" style="fill:#047857">click within 12 px of A,</text>
  <text x="198" y="471" class="lbl" style="fill:#047857">≥ 3 vertices, valid shape</text>
  <text x="198" y="485" class="s">→ polygons.addDraft(), selected</text>
  <text x="198" y="508" class="lbl">Esc · Cancel · Delete all</text>
  <text x="198" y="522" class="s">→ cancelMode(), vertices dropped</text>
  <!-- idle -> placeObject -->
  <path d="M498,600 L668,404" class="a"/>
  <text x="628" y="482" class="lb">Objects ▸ Add</text>
  <text x="628" y="497" class="s">startPlacing()</text>
  <!-- placeObject -> idle -->
  <path d="M560,404 L430,598" class="ok"/>
  <rect x="395" y="440" width="190" height="96" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="403" y="457" class="lbl" style="fill:#047857">map click</text>
  <text x="403" y="471" class="s">→ objects.addDraft(), selected,</text>
  <text x="403" y="485" class="s">   name via nextName ("Jeep 2")</text>
  <text x="403" y="508" class="lbl">Esc · Cancel</text>
  <text x="403" y="522" class="s">→ cancelMode()</text>

  <text x="38" y="764" class="s">Keyboard handler is attached only while mode ≠ idle. Esc always returns to idle and clears drawingVertices / drawingProblem.</text>

  <!-- ===================================== B ===================================== -->
  <rect x="760" y="78" width="720" height="700" rx="14" fill="#fcfcfd" stroke="#d1d5db"/>
  <text x="778" y="104" class="sec">B. Item lifecycle — useEditableCollection (polygons, objects)</text>
  <text x="778" y="122" class="m">saved: TItem[] (server)  ·  drafts: TItem[] (browser)  ·  selectedId  ·  busy  ·  error</text>

  <!-- Draft -->
  <text x="870" y="166" class="lb">objects only: drag marker</text>
  <text x="870" y="182" class="s">→ updateDraft(id, { position })</text>
  <path d="M900,232 C 870,196 1010,196 980,232" class="a"/>
  <rect x="850" y="232" width="230" height="130" rx="16" class="st-draft"/>
  <text x="866" y="256" class="h">Draft</text>
  <text x="866" y="276" class="b">in drafts[] only — not on server</text>
  <text x="866" y="293" class="b">dashed polygon / faded icon</text>
  <text x="866" y="310" class="b">not in the Map Data table</text>
  <text x="866" y="327" class="m">id: 'draft-9f3c…' (random)</text>
  <text x="866" y="348" class="s">counted as "n unsaved" + beforeunload</text>

  <circle cx="790" cy="297" r="7" fill="#111827"/>
  <path d="M797,297 L848,297" class="a"/>
  <text x="772" y="324" class="s">on close /</text>
  <text x="772" y="338" class="s">on place</text>

  <!-- Saving -->
  <rect x="1200" y="232" width="250" height="130" rx="16" class="st-busy"/>
  <text x="1216" y="256" class="h">Saving  <tspan class="s" font-weight="400">(busy = true)</tspan></text>
  <text x="1216" y="276" class="b">POST all drafts as one batch</text>
  <text x="1216" y="293" class="b">panel buttons disabled</text>
  <text x="1216" y="310" class="b">batch = snapshot of drafts</text>
  <text x="1216" y="327" class="s">drafts created meanwhile are</text>
  <text x="1216" y="341" class="s">not part of this batch and survive</text>

  <path d="M1082,280 L1198,280" class="a"/>
  <text x="1140" y="272" text-anchor="middle" class="lb">Save</text>
  <path d="M1198,330 L1082,330" class="bad"/>
  <text x="1140" y="348" text-anchor="middle" class="s red">400 / 503 / offline</text>
  <text x="1092" y="380" class="s red">error banner, all drafts kept:</text>
  <text x="1092" y="394" class="s red">"Polygon 2: edges must not cross…"</text>

  <!-- Saved -->
  <rect x="1200" y="480" width="250" height="130" rx="16" class="st-saved"/>
  <text x="1216" y="504" class="h">Saved</text>
  <text x="1216" y="524" class="b">in saved[] = last server response</text>
  <text x="1216" y="541" class="b">solid style, clickable, not draggable</text>
  <text x="1216" y="558" class="b">rows in the Map Data table</text>
  <text x="1216" y="575" class="m">id: '6729f0…' (ObjectId)</text>
  <text x="1216" y="596" class="s">re-read after every write (no local patching)</text>

  <path d="M1325,364 L1325,478" class="ok"/>
  <text x="1315" y="418" text-anchor="end" class="lbl" style="fill:#047857">200 OK</text>
  <text x="1315" y="433" text-anchor="end" class="s">saved = response.map(fromDto)</text>
  <text x="1315" y="447" text-anchor="end" class="s">drafts −= batch</text>

  <!-- page load -->
  <circle cx="1470" cy="700" r="7" fill="#111827"/>
  <path d="M1470,693 C 1470,650 1430,630 1400,612" class="a"/>
  <text x="1430" y="690" class="s" text-anchor="end">page load: GET list on mount</text>
  <text x="1430" y="704" class="s" text-anchor="end">(AbortController, StrictMode-safe)</text>

  <!-- Deleted end state -->
  <circle cx="965" cy="560" r="12" fill="none" stroke="#111827" stroke-width="2"/>
  <circle cx="965" cy="560" r="7" fill="#111827"/>
  <text x="965" y="592" text-anchor="middle" class="b">removed</text>

  <path d="M965,364 L965,546" class="a"/>
  <text x="975" y="430" class="lb">Delete selected</text>
  <text x="975" y="445" class="s">local only: no request,</text>
  <text x="975" y="459" class="s">no confirm dialog</text>

  <path d="M1198,545 L980,557" class="a"/>
  <text x="1090" y="520" text-anchor="middle" class="lb">Delete selected</text>
  <text x="1090" y="535" text-anchor="middle" class="s">confirm → DELETE /{id} → reload()</text>
  <text x="1090" y="580" text-anchor="middle" class="s">404 is treated as success</text>
  <text x="1090" y="594" text-anchor="middle" class="s">(already deleted in another tab)</text>

  <!-- delete all note -->
  <rect x="790" y="640" width="430" height="120" rx="10" class="note"/>
  <text x="806" y="662" class="lb">Delete all (Polygon panel)</text>
  <text x="806" y="680" class="b">confirm → cancelMode() → DELETE /api/polygons</text>
  <text x="806" y="697" class="b">→ drafts = [] → selectedId = null → reload()</text>
  <text x="806" y="720" class="lb">Why "reload" instead of editing the array locally?</text>
  <text x="806" y="737" class="s">The server is the source of truth: after any write the client</text>
  <text x="806" y="751" class="s">shows exactly what MongoDB has (other tabs, races, rollbacks).</text>
</svg>
